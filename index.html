<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Página</title>
    <style>
        body { font-family: Arial; text-align: center; margin: 0; }
        header { display: flex; justify-content: space-between; padding: 10px 20px; background-color: #f0f0f0; }
        .btn { padding: 10px 20px; cursor: pointer; }
        #mensaje { color: red; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <div>
            <button class="btn" onclick="calcular()">Calcular</button>
        </div>
        <div>
            {% if user.is_authenticated %}
                <span>{{ user.username }}</span>
                <a href="{% url 'logout' %}" class="btn">Cerrar sesión</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn">Registrarse</a>
            {% endif %}
        </div>
    </header>

    <main>
        <h1>Bienvenido a mi página personalizada</h1>
        <p>Este es el texto que tú elijas, Matías.</p>
        <div id="mensaje"></div>
    </main>

    <script>
        function calcular() {
            const usuarioAutenticado = {{ user.is_authenticated|yesno:"true,false" }};
            const mensaje = document.getElementById("mensaje");
            if (!usuarioAutenticado) {
                mensaje.textContent = "Debes iniciar sesión primero.";
            } else {
                mensaje.textContent = "¡Cálculo realizado!";
            }
        }
    </script>
</body>
</html>
